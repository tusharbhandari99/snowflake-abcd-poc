name: Snowflake dbt CI-CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_DATABASE: ABCD_POC_DB
  SNOWFLAKE_WAREHOUSE: W_TRANSFORM_POC
  DBT_PROFILES_DIR: .

jobs:
  # ====================================================================
  # JOB 1: CI VALIDATION (Runs on Pull Requests in Dev Sandbox)
  # ====================================================================
  ci-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: dev
      SNOWFLAKE_ROLE: DBT_DEVELOPER_ROLE
    defaults:
      run:
        working-directory: ABCD
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt and Snowflake Connector
        run: |
          pip install dbt-snowflake snowflake-connector-python

      - name: Validate Models, Contracts, and Tests in Sandbox
        id: dbt_dev_build
        continue-on-error: true
        run: |
          dbt deps
          dbt build --target dev

      - name: Dispatch Snowflake Email Notification on CI Failure
        if: steps.dbt_dev_build.outcome == 'failure'
        env:
          GH_REPO: ${{ github.repository }}
          GH_HEAD_REF: ${{ github.head_ref }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os
          import json
          import snowflake.connector

          # Locate target/run_results.json and logs/dbt.log safely
          base_dir = os.getcwd()
          results_path = os.path.join(base_dir, "target", "run_results.json")
          logs_path = os.path.join(base_dir, "logs", "dbt.log")

          error_lines = []

          # 1. Parse run_results.json
          if os.path.exists(results_path):
              try:
                  with open(results_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      for r in data.get("results", []):
                          if r.get("status") in ("error", "fail"):
                              model = r.get("unique_id", "Unknown Model")
                              msg = r.get("message", "No explicit error message returned.")
                              error_lines.append(f"[{r.get('status').upper()}] {model}\n{msg}\n")
              except Exception as e:
                  error_lines.append(f"Failed to read run_results.json: {str(e)}")

          # 2. Fallback: Parse dbt.log tail for compilation errors
          if not error_lines and os.path.exists(logs_path):
              try:
                  with open(logs_path, "r", encoding="utf-8") as f:
                      lines = [line.strip() for line in f.readlines() if line.strip()]
                      recent = [
                          l for l in lines[-40:] 
                          if any(term in l for term in ["Compilation Error", "enforced contract", "mismatch", "failed", "Failure"])
                      ]
                      if recent:
                          error_lines.append("\n".join(recent))
              except Exception as e:
                  error_lines.append(f"Failed to read dbt.log: {str(e)}")

          # Default message if both fail to find an error
          if not error_lines:
              error_summary = "Build failed, but specific error details could not be parsed. Check GitHub Actions logs."
          else:
              error_summary = "\n----------------------------------------\n".join(error_lines)

          # Construct Clean Email Message
          subject = f"[CI FAILED] dbt Schema Validation - {os.environ.get('GH_HEAD_REF')}"
          
          body = (
              "====================================================\n"
              "DBT PIPELINE EXECUTION FAILURE\n"
              "====================================================\n\n"
              "DETAILS & ERROR REASON:\n"
              f"{error_summary}\n\n"
              "====================================================\n"
              "WORKFLOW METADATA:\n"
              "====================================================\n"
              f"Repository:   {os.environ.get('GH_REPO')}\n"
              f"Branch:       {os.environ.get('GH_HEAD_REF')}\n"
              f"Commit SHA:   {os.environ.get('GH_SHA')}\n"
              f"Triggered By: {os.environ.get('GH_ACTOR')}\n"
              f"Action URL:   {os.environ.get('GH_RUN_URL')}\n"
          )

          # Connect and Dispatch via Snowflake
          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              role=os.environ['SNOWFLAKE_ROLE'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=os.environ['SNOWFLAKE_DATABASE'],
              schema='ABCD_SILVER'
          )

          cur = conn.cursor()
          cur.execute("CALL ABCD_POC_DB.ABCD_SILVER.SEND_PIPELINE_EMAIL(%s, %s)", (subject, body))
          cur.close()
          conn.close()

          print("Failure notification sent.")
          exit(1)
          EOF

  # ====================================================================
  # JOB 2: CD DEPLOYMENT (Runs on Merge to Main in Production)
  # ====================================================================
  cd-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: prod
      SNOWFLAKE_ROLE: DBT_CICD_PROD_ROLE
    defaults:
      run:
        working-directory: ABCD
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt and Snowflake Connector
        run: |
          pip install dbt-snowflake snowflake-connector-python

      - name: Run Production dbt Build (Transform & Deploy)
        id: dbt_prod_build
        continue-on-error: true
        run: |
          dbt deps
          dbt build --target prod

      - name: Dispatch Snowflake Email Notification on CD Failure
        if: steps.dbt_prod_build.outcome == 'failure'
        env:
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import os
          import json
          import snowflake.connector

          base_dir = os.getcwd()
          results_path = os.path.join(base_dir, "target", "run_results.json")
          logs_path = os.path.join(base_dir, "logs", "dbt.log")

          error_lines = []

          # 1. Parse run_results.json
          if os.path.exists(results_path):
              try:
                  with open(results_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                      for r in data.get("results", []):
                          if r.get("status") in ("error", "fail"):
                              model = r.get("unique_id", "Unknown Model")
                              msg = r.get("message", "No explicit error message returned.")
                              error_lines.append(f"[{r.get('status').upper()}] {model}\n{msg}\n")
              except Exception as e:
                  error_lines.append(f"Failed to read run_results.json: {str(e)}")

          # 2. Fallback: Parse dbt.log tail
          if not error_lines and os.path.exists(logs_path):
              try:
                  with open(logs_path, "r", encoding="utf-8") as f:
                      lines = [line.strip() for line in f.readlines() if line.strip()]
                      recent = [
                          l for l in lines[-40:] 
                          if any(term in l for term in ["Compilation Error", "enforced contract", "mismatch", "failed", "Failure"])
                      ]
                      if recent:
                          error_lines.append("\n".join(recent))
              except Exception as e:
                  error_lines.append(f"Failed to read dbt.log: {str(e)}")

          if not error_lines:
              error_summary = "Deployment failed, but specific error details could not be parsed. Check GitHub Actions logs."
          else:
              error_summary = "\n----------------------------------------\n".join(error_lines)

          subject = "[PROD FAILED] dbt Deployment Failed on main"
          
          body = (
              "====================================================\n"
              "PRODUCTION DBT DEPLOYMENT FAILURE\n"
              "====================================================\n\n"
              "DETAILS & ERROR REASON:\n"
              f"{error_summary}\n\n"
              "====================================================\n"
              "WORKFLOW METADATA:\n"
              "====================================================\n"
              f"Repository:   {os.environ.get('GH_REPO')}\n"
              f"Branch:       main\n"
              f"Commit SHA:   {os.environ.get('GH_SHA')}\n"
              f"Triggered By: {os.environ.get('GH_ACTOR')}\n"
              f"Action URL:   {os.environ.get('GH_RUN_URL')}\n"
          )

          conn = snowflake.connector.connect(
              user=os.environ['SNOWFLAKE_USER'],
              password=os.environ['SNOWFLAKE_PASSWORD'],
              account=os.environ['SNOWFLAKE_ACCOUNT'],
              role=os.environ['SNOWFLAKE_ROLE'],
              warehouse=os.environ['SNOWFLAKE_WAREHOUSE'],
              database=os.environ['SNOWFLAKE_DATABASE'],
              schema='ABCD_SILVER'
          )

          cur = conn.cursor()
          cur.execute("CALL ABCD_POC_DB.ABCD_SILVER.SEND_PIPELINE_EMAIL(%s, %s)", (subject, body))
          cur.close()
          conn.close()

          print("Production failure notification sent.")
          exit(1)
          EOF
