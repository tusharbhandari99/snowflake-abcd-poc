name: Snowflake dbt CI-CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_DATABASE: ABCD_POC_DB
  SNOWFLAKE_WAREHOUSE: W_TRANSFORM_POC
  DBT_PROFILES_DIR: .

jobs:
  # ====================================================================
  # JOB 1: CI VALIDATION (Runs on Pull Requests in Sandbox)
  # ====================================================================
  ci-validation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: dev
      SNOWFLAKE_ROLE: DBT_DEVELOPER_ROLE
    defaults:
      run:
        working-directory: ABCD
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt and SQLFluff Dependencies
        run: |
          pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Run SQLFluff Linting Gate
        run: |
          dbt deps
          sqlfluff lint models --config ../.sqlfluff

      - name: Validate SQL and Test Data Quality in Sandbox
        run: |
          dbt compile --target dev
          dbt test --target dev

  # ====================================================================
  # JOB 2: CD DEPLOYMENT (Runs on Merge to Main in Production)
  # ====================================================================
  cd-deployment:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DBT_TARGET: prod
      SNOWFLAKE_ROLE: DBT_CICD_PROD_ROLE
    defaults:
      run:
        working-directory: ABCD
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dbt-snowflake Adapter
        run: pip install dbt-snowflake

      - name: Run Production dbt Build (Transform & Deploy)
        run: |
          dbt deps
          dbt build --target prod
